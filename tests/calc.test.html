<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste — cálculo de rateio</title>
<style>
  body { font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
         margin: 0; padding: 24px; background: #0f1117; color: #d7dae0; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: #8b93a7; }
  pre { white-space: pre-wrap; margin: 0; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  #selo { display: inline-block; padding: 6px 14px; border-radius: 6px;
          font-weight: 700; margin-bottom: 16px; }
  #selo.ok { background: #14532d; color: #86efac; }
  #selo.err { background: #4c1d1d; color: #fca5a5; }
</style>
</head>
<body>
  <h1>Teste do cálculo de rateio</h1>
  <p class="sub">Prova que a soma das contas bate com o custo real, no centavo.</p>
  <div id="selo">rodando…</div>
  <pre id="saida"></pre>

<script src="../js/calc.js"></script>
<script>
  // captura a saída do teste na página
  const saida = document.getElementById("saida");
  const original = console.log;
  console.log = function (msg) {
    original.apply(console, arguments);
    const linha = document.createElement("div");
    const texto = String(msg);
    if (texto.indexOf("✗") >= 0) linha.className = "err";
    else if (texto.indexOf("✓") >= 0) linha.className = "ok";
    linha.textContent = texto;
    saida.appendChild(linha);
  };
  window.addEventListener("error", function () {
    const selo = document.getElementById("selo");
    selo.className = "err";
    selo.textContent = "FALHOU";
  });
</script>
<script src="calc.test.js"></script>
<script>
  const selo = document.getElementById("selo");
  if (selo.textContent === "rodando…") {
    selo.className = "ok";
    selo.textContent = "PASSOU";
  }
</script>
</body>
</html>
